name: PACT Minimal Fresh Adoption Trial

on:
  push:
    branches:
      - "pact-minimal-user-test/fresh-adoption"
  pull_request:
    branches:
      - "pact-real-user-test/base-multi-client-round-robin"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "pact-minimal-user-test/fresh-adoption"
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fresh install current PACT PR
        shell: bash
        run: |
          set -euo pipefail
          PACT_REF="28302ac15182afba8c1f82c3dd91a510f1cc952d"
          curl -fsSLo /tmp/pact-bootstrap.py \
            "https://raw.githubusercontent.com/ningcol/PACT/${PACT_REF}/bootstrap.py"

          python /tmp/pact-bootstrap.py init \
            --target . \
            --repo ningcol/PACT \
            --ref "${PACT_REF}" \
            --apply

          python - <<'PY'
          import json
          import pathlib

          manifest_path = pathlib.Path(".pact/install.json")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          files = data.get("files", {})
          framework = [p for p, r in files.items() if r.get("management") == "framework"]
          seed = [p for p, r in files.items() if r.get("management") == "seed"]
          print("PACT_INSTALL",
                f"managed={len(files)} framework={len(framework)} ",
                f"seed={len(seed)} physical={len(files) + 1}")
          print("PACT_MANAGED_PATHS")
          for path in sorted(files):
              print(path)

          assert "install_profile" not in data, data
          assert len(files) <= 8, len(files)
          assert ".pact/.gitignore" in files, files
          assert pathlib.Path(".pact/.gitignore").is_file()
          rules = set(pathlib.Path(".pact/.gitignore").read_text().splitlines())
          assert {"cache/", "tasks/", "runs/", "completions/", "tmp/"} <= rules, rules
          assert not pathlib.Path("scripts/pact").exists()
          for relative in [
              "docs/governance",
              "docs/product",
              "docs/architecture",
              "docs/changes",
              "docs/drift",
              ".agents/decisions",
              ".agents/skills",
          ]:
              assert not pathlib.Path(relative).exists(), relative
          PY

      - name: Validate minimal runtime end to end
        run: |
          set -euo pipefail
          python pact.py doctor --strict
          python pact.py status --strict --json | tee /tmp/pact-status.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/pact-status.json"))
          assert data["overall"] == "pass", data
          assert data["readiness"]["stage"] == "foundation-valid", data
          assert "baseline-review-pending" in data["warnings"], data
          print("PACT status is healthy with baseline readiness advisory.")
          PY
          python pact.py schema-lint
          python pact.py task prepare \
            "MCP 支持多个豆包客户端轮询分发图片生成任务，同一个客户端允许多个 Tab 并发处理" \
            --success "能够定位并准备多客户端/多 Tab 调度任务所需上下文" \
            --accept "现有单客户端单 Tab 行为仍被视为兼容约束" \
            --constraint "不把当前代码行为自动提升为 Product Truth" \
            --risk medium \
            --query "MCP 多客户端 轮询 分发 websocket" \
            --query "browser tabs concurrent task dispatch" \
            --code \
            --task-id TASK-MINIMAL-ADOPTION \
            --json

          echo '----- TASK CONTEXT -----'
          cat .pact/tasks/TASK-MINIMAL-ADOPTION/context.json
          python - <<'PY'
          import json
          import pathlib
          data = json.loads(
              pathlib.Path(".pact/tasks/TASK-MINIMAL-ADOPTION/context.json").read_text(
                  encoding="utf-8"
              )
          )
          budget = data["risk_policy"]["code_limit"]
          code = data["code_artifacts"]
          assert len(code) <= budget, (len(code), budget)
          paths = {item["path"] for item in code}
          assert "McpServer/server.py" in paths, paths
          assert "DoubaoMcpBrowserProxy/background.js" in paths, paths
          token_budget = data["context_budget"]["limit_tokens"]
          selected_tokens = data["context_budget"]["selected_estimated_tokens"]
          overage = data["context_budget"]["authority_overage_tokens"]
          assert selected_tokens <= token_budget + overage, (
              selected_tokens,
              token_budget,
              overage,
          )
          print("PACT_CONTEXT_BUDGET", f"budget={budget} output={len(code)}")
          print(
              "PACT_TOKEN_BUDGET",
              f"limit={token_budget} selected={selected_tokens} "
              f"candidates={data['context_budget']['candidate_estimated_tokens']} "
              f"dropped={data['context_budget']['dropped_candidates']} "
              f"overage={overage}",
          )
          PY

      - name: Inspect remembered multi-client behavior
        run: |
          set -euo pipefail
          python pact.py inspect             "多个豆包客户端如何分发图片生成任务"             --query "multi client round robin websocket"             --query "background browser tabs dispatch"             --code-limit 6             --json > /tmp/pact-inspect.json

          python - <<'PY'
          import json
          data = json.load(open("/tmp/pact-inspect.json", encoding="utf-8"))
          assert data["queries"] == [
              "多个豆包客户端如何分发图片生成任务",
              "multi client round robin websocket",
              "background browser tabs dispatch",
          ], data["queries"]
          code = data["discovery"]["code_results"]
          assert len(code) <= 6, len(code)
          paths = {item["path"] for item in code}
          assert "McpServer/server.py" in paths, paths
          assert "DoubaoMcpBrowserProxy/background.js" in paths, paths
          print("PACT_INSPECT_CODE", len(code), sorted(paths))
          PY

      - name: Complete a real medium-risk PACT task
        run: |
          set -euo pipefail
          TASK_ID="TASK-MINIMAL-ADOPTION"
          mkdir -p ".pact/runs/$TASK_ID"

          printf '\n# PACT task-change coverage validation\n' >> McpServer/server.py

          python pact.py run \
            --task-id "$TASK_ID" \
            --output ".pact/runs/$TASK_ID/context-check.json" \
            -- \
            python -c 'import json, pathlib; p=pathlib.Path(".pact/tasks/TASK-MINIMAL-ADOPTION/context.json"); c=json.loads(p.read_text()); paths={x["path"] for x in c["code_artifacts"]}; assert "McpServer/server.py" in paths, paths; assert c["known_unknowns"], c'

          python - <<'PY'
          import json
          import pathlib

          task_id = "TASK-MINIMAL-ADOPTION"
          task_dir = pathlib.Path(".pact/tasks") / task_id
          bundle = pathlib.Path(".pact/completions") / task_id
          bundle.mkdir(parents=True, exist_ok=True)

          manifest = json.loads((task_dir / "task.json").read_text(encoding="utf-8"))
          contract = json.loads((task_dir / "contract.json").read_text(encoding="utf-8"))
          context = json.loads((task_dir / "context.json").read_text(encoding="utf-8"))

          criteria = [item["id"] for item in contract["acceptance_criteria"]]
          evidence_id = "EV-CONTEXT-VERIFIED"

          evidence = {
              "version": 1,
              "task_id": task_id,
              "task": manifest["task"],
              "risk_level": "medium",
              "task_contract_sha256": manifest["contract_sha256"],
              "claims": [{
                  "id": evidence_id,
                  "claim": "Prepared context was machine-checked against the real historical repository.",
                  "required": True,
                  "status": "pass",
                  "criteria": criteria,
                  "evidence": [{
                      "kind": "test",
                      "provenance": "pact-run",
                      "ref": f".pact/runs/{task_id}/context-check.json",
                  }],
              }],
              "limitations": [],
          }

          coverage = [{
              "path": item["path"],
              "disposition": "aligned",
              "rationale": "This validation-only task did not change project knowledge; the prepared artifact remains aligned.",
          } for item in context.get("artifacts", [])]

          convergence = {
              "version": 1,
              "task_id": task_id,
              "change": "Validate PACT context preparation and trust boundaries on the historical project.",
              "owner_summary": "The prepared context remained aligned and the real code location was verified by a workspace-bound run.",
              "evidence": [evidence_id],
              "findings": [],
              "context_sha256": manifest["context_sha256"],
              "coverage": coverage,
          }

          owner = {
              "version": 1,
              "task_id": task_id,
              "status": "completed",
              "summary": "PACT completed the historical context-validation task.",
              "before": "The historical project had no PACT task context for this request.",
              "after": "PACT prepared context and machine-verified the expected MCP server implementation location.",
              "verification": [{
                  "claim": "Prepared context was machine-checked against the real historical repository.",
                  "evidence_ids": [evidence_id],
              }],
              "acceptance": [{
                  "criterion_id": item["id"],
                  "summary": item["text"],
                  "evidence_ids": [evidence_id],
              } for item in contract["acceptance_criteria"]],
              "consistency": {
                  "status": "aligned",
                  "summary": "The ephemeral MCP server comment is the only product-source change and is reviewed below.",
              },
              "owner_decisions": [],
          }

          for name, data in [
              ("evidence.json", evidence),
              ("convergence.json", convergence),
              ("owner-report.json", owner),
          ]:
              (bundle / name).write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

          set +e
          python pact.py task finish "$TASK_ID" --json > /tmp/pact-task-blocked.json
          blocked_rc=$?
          set -e
          test "$blocked_rc" -eq 1

          python - <<'PY'
          import json
          import pathlib

          blocked = json.load(open("/tmp/pact-task-blocked.json", encoding="utf-8"))
          assert blocked["complete"] is False, blocked
          assert blocked["task_change"]["changed_files"] == ["McpServer/server.py"], blocked
          assert any(
              "Task changed file missing from Convergence change coverage" in error
              for error in blocked["errors"]
          ), blocked["errors"]

          impact_path = pathlib.Path(blocked["final_impact"])
          assert impact_path.is_file(), impact_path
          impact = json.loads(impact_path.read_text(encoding="utf-8"))
          assert impact["changed_files"] == ["McpServer/server.py"], impact

          convergence_path = pathlib.Path(
              ".pact/completions/TASK-MINIMAL-ADOPTION/convergence.json"
          )
          convergence = json.loads(convergence_path.read_text(encoding="utf-8"))
          convergence["change_coverage"] = [{
              "path": "McpServer/server.py",
              "rationale": "Ephemeral validation comment intentionally exercises task changed-file attribution.",
          }]
          convergence_path.write_text(
              json.dumps(convergence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PACT_CHANGE_BLOCKED", blocked["task_change"]["changed_files"])
          PY

          python pact.py task finish "$TASK_ID" --json | tee /tmp/pact-task-finish.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/pact-task-finish.json"))
          assert data["complete"] is True, data
          assert data["workspace_bound_claims"] >= 1, data
          assert data["task_change"]["changed_files"] == ["McpServer/server.py"], data
          assert data["change_coverage"]["covered_changed_files"] == 1, data
          print("PACT real task completion passed with changed-file coverage.")
          PY

      - name: Assert no empty scaffold appeared during task preparation
        run: |
          set -euo pipefail
          test ! -d docs/governance
          test ! -d docs/product
          test ! -d docs/architecture
          test ! -d docs/changes
          test ! -d docs/drift
          test ! -d .agents/decisions
          test ! -d .agents/skills
          test ! -d scripts/pact

          git check-ignore -q .pact/tasks/TASK-MINIMAL-ADOPTION/task.json
          git check-ignore -q .pact/runs/TASK-MINIMAL-ADOPTION/context-check.json
          git check-ignore -q .pact/completions/TASK-MINIMAL-ADOPTION/evidence.json

          echo "----- GIT STATUS -----"
          git status --short
          if git status --short | grep -E '^\?\? \.pact/(tasks|runs|completions|cache|tmp)/'; then
            echo "PACT generated state leaked into git status"
            exit 1
          fi
