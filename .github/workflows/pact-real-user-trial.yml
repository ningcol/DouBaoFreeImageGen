name: PACT Real User Trial

on:
  push:
    branches:
      - "pact-real-user-test/multi-client-round-robin"

permissions:
  contents: write

jobs:
  real-user-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "pact-real-user-test/multi-client-round-robin"
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Adopt or upgrade pinned PACT runtime
        shell: bash
        run: |
          set -euo pipefail
          PACT_REF="c8f114928ec64436bc192591343f0b5d15332b2d"

          python - <<'PY'
          import json
          import pathlib

          manifest = pathlib.Path(".pact/install.json")
          if manifest.is_file():
              data = json.loads(manifest.read_text(encoding="utf-8"))
              files = data.get("files", {})
              framework = [p for p, r in files.items() if r.get("management") == "framework"]
              seed = [p for p, r in files.items() if r.get("management") == "seed"]
              runtime = [p for p in framework if p.startswith("scripts/pact/")]
              schemas = [p for p in files if p.startswith(".pact/schema/")]
              print(
                  "PACT_INSTALL_BEFORE "
                  f"managed={len(files)} framework={len(framework)} "
                  f"seed={len(seed)} scripts_pact={len(runtime)} "
                  f"schemas={len(schemas)}"
              )
              print("PACT_SCHEMA_BEFORE", *sorted(schemas), sep="\n")
          PY

          curl -fsSLo /tmp/pact-bootstrap.py \
            "https://raw.githubusercontent.com/ningcol/PACT/${PACT_REF}/bootstrap.py"

          if [ -f pact.py ]; then
            python /tmp/pact-bootstrap.py upgrade \
              --target . \
              --repo ningcol/PACT \
              --ref "${PACT_REF}" \
              --apply
          else
            python /tmp/pact-bootstrap.py init \
              --target . \
              --repo ningcol/PACT \
              --ref "${PACT_REF}" \
              --apply
          fi

          git config user.name "PACT Real User Trial"
          git config user.email "pact-trial@users.noreply.github.com"
          git add -A
          python - <<'PY'
          import json
          import pathlib

          data = json.loads(
              pathlib.Path(".pact/install.json").read_text(encoding="utf-8")
          )
          files = data.get("files", {})
          framework = [p for p, r in files.items() if r.get("management") == "framework"]
          seed = [p for p, r in files.items() if r.get("management") == "seed"]
          runtime = [p for p in framework if p.startswith("scripts/pact/")]
          schemas = [p for p in files if p.startswith(".pact/schema/")]
          schema_framework = [
              p for p in schemas
              if files[p].get("management") == "framework"
          ]
          schema_seed = [
              p for p in schemas
              if files[p].get("management") == "seed"
          ]
          compact = ".pact/pact.pyz" in framework
          print(
              "PACT_INSTALL_AFTER "
              f"managed={len(files)} framework={len(framework)} "
              f"seed={len(seed)} scripts_pact={len(runtime)} "
              f"schemas={len(schemas)} schema_framework={len(schema_framework)} "
              f"schema_seed={len(schema_seed)} compact={compact}"
          )
          print("PACT_RUNTIME_PATHS", *sorted(runtime), sep="\n")
          print("PACT_SCHEMA_AFTER", *sorted(schemas), sep="\n")
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "PACT is already at the pinned runtime."
          else
            git commit -m "test: upgrade PACT runtime for real-user trial"
            git push origin HEAD:pact-real-user-test/multi-client-round-robin
          fi

      - name: PACT health and legacy compatibility
        if: ${{ hashFiles('pact.py') != '' }}
        run: |
          python pact.py doctor --strict
          python pact.py status --json
          python pact.py schema-lint
          python scripts/pact/pact.py --help
          python scripts/pact/converge.py --help
          python scripts/pact/report.py --help

          python - <<'PY'
          import json
          import pathlib

          data = json.loads(
              pathlib.Path(".pact/install.json").read_text(encoding="utf-8")
          )
          files = data["files"]
          runtime = sorted(
              p for p, record in files.items()
              if record.get("management") == "framework"
              and p.startswith("scripts/pact/")
          )
          expected_runtime = [
              "scripts/pact/converge.py",
              "scripts/pact/pact.py",
              "scripts/pact/report.py",
          ]
          if runtime != expected_runtime:
              raise SystemExit(
                  f"unexpected compatibility runtime surface: {runtime}"
              )

          schema_framework = [
              p for p, record in files.items()
              if p.startswith(".pact/schema/")
              and record.get("management") == "framework"
          ]
          if schema_framework:
              raise SystemExit(
                  f"framework schemas should be embedded, found: {schema_framework}"
              )
          PY

      - name: Prepare real user task
        if: ${{ hashFiles('pact.py') != '' }}
        run: |
          python pact.py task prepare \
            "MCP 支持多个豆包客户端轮询分发图片生成任务，同一个客户端允许多个 Tab 并发处理" \
            --success "多个已连接客户端能够轮询获得任务并返回各自结果" \
            --accept "同一个客户端的多个 Tab 可以同时参与任务处理" \
            --accept "客户端断开或某个 Tab 不可用时不会把整个任务分发流程卡死" \
            --constraint "原有单客户端单 Tab 使用方式继续可用" \
            --risk medium \
            --code \
            --task-id TASK-REAL-MULTI-CLIENT \
            --json

          echo "----- PACT CONTEXT -----"
          cat .pact/tasks/TASK-REAL-MULTI-CLIENT/context.json
          echo "----- TASK CONTRACT -----"
          cat .pact/tasks/TASK-REAL-MULTI-CLIENT/contract.json


      - name: PACT impact review
        if: ${{ hashFiles('pact.py') != '' }}
        run: |
          python pact.py impact \
            --files \
              README.md \
              McpServer/server.py \
              McpServer/test_server_dispatch.py \
              DoubaoMcpBrowserProxy/background.js \
              DoubaoMcpBrowserProxy/content.js \
              DoubaoMcpBrowserProxy/test_background_dispatch.js \
            --risk medium \
            --code \
            --output .pact/tasks/TASK-REAL-MULTI-CLIENT/impact.json
          cat .pact/tasks/TASK-REAL-MULTI-CLIENT/impact.json

      - name: Verify server scheduling through PACT
        if: ${{ hashFiles('pact.py') != '' }}
        run: |
          python pact.py run \
            --task-id TASK-REAL-MULTI-CLIENT \
            --output .pact/runs/TASK-REAL-MULTI-CLIENT/server-tests.json \
            --quiet \
            -- python -m unittest McpServer/test_server_dispatch.py

      - name: Verify browser dispatch through PACT
        if: ${{ hashFiles('pact.py') != '' }}
        run: |
          python pact.py run \
            --task-id TASK-REAL-MULTI-CLIENT \
            --output .pact/runs/TASK-REAL-MULTI-CLIENT/browser-tests.json \
            --quiet \
            -- bash -lc "node --check DoubaoMcpBrowserProxy/background.js && node --check DoubaoMcpBrowserProxy/content.js && node DoubaoMcpBrowserProxy/test_background_dispatch.js"

      - name: Build evidence-backed completion bundle
        if: ${{ hashFiles('pact.py') != '' }}
        run: |
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path(".")
          task_id = "TASK-REAL-MULTI-CLIENT"
          task_dir = root / ".pact" / "tasks" / task_id
          bundle = root / ".pact" / "completions" / task_id
          bundle.mkdir(parents=True, exist_ok=True)

          manifest = json.loads((task_dir / "task.json").read_text(encoding="utf-8"))
          contract = json.loads((task_dir / "contract.json").read_text(encoding="utf-8"))

          server_ref = f".pact/runs/{task_id}/server-tests.json"
          browser_ref = f".pact/runs/{task_id}/browser-tests.json"

          claims = [
              {
                  "id": "EV-ROUND-ROBIN",
                  "claim": "Connected MCP clients are selected in round-robin order and task results are request-scoped.",
                  "required": True,
                  "status": "pass",
                  "criteria": ["AC-1"],
                  "evidence": [
                      {"kind": "test", "provenance": "pact-run", "ref": server_ref}
                  ],
              },
              {
                  "id": "EV-MULTI-TAB",
                  "claim": "One browser client exposes multiple independent tab slots and does not double-dispatch to busy tabs.",
                  "required": True,
                  "status": "pass",
                  "criteria": ["AC-2"],
                  "evidence": [
                      {"kind": "test", "provenance": "pact-run", "ref": server_ref},
                      {"kind": "test", "provenance": "pact-run", "ref": browser_ref},
                  ],
              },
              {
                  "id": "EV-FAILOVER",
                  "claim": "Disconnected clients or unavailable tabs fail their own request without corrupting unrelated pending work.",
                  "required": True,
                  "status": "pass",
                  "criteria": ["AC-3"],
                  "evidence": [
                      {"kind": "test", "provenance": "pact-run", "ref": server_ref},
                      {"kind": "test", "provenance": "pact-run", "ref": browser_ref},
                  ],
              },
              {
                  "id": "EV-SINGLE-CLIENT",
                  "claim": "A single client with one ready tab remains a valid capacity-one scheduling path and legacy raw commands remain parseable.",
                  "required": True,
                  "status": "pass",
                  "criteria": ["AC-4"],
                  "evidence": [
                      {"kind": "test", "provenance": "pact-run", "ref": server_ref},
                      {"kind": "test", "provenance": "pact-run", "ref": browser_ref},
                  ],
              },
          ]

          evidence = {
              "version": 1,
              "task_id": task_id,
              "task": manifest["task"],
              "risk_level": manifest["risk_level"],
              "task_contract_sha256": manifest["contract_sha256"],
              "claims": claims,
              "limitations": [
                  "GitHub Actions cannot launch a real Doubao desktop session; browser protocol behavior is verified with executable Chrome/WebSocket mocks rather than a live external service.",
                  "PACT brownfield readiness remains pending for project vocabulary/Product Truth because this branch is an isolated real-user trial.",
              ],
          }

          convergence = {
              "version": 1,
              "task_id": task_id,
              "change": manifest["task"],
              "owner_summary": "Code and README now describe multiple browser clients and multiple ready tabs as independent scheduling capacity while preserving the capacity-one path.",
              "evidence": [claim["id"] for claim in claims],
              "findings": [],
          }

          evidence_for = {
              "AC-1": ["EV-ROUND-ROBIN"],
              "AC-2": ["EV-MULTI-TAB"],
              "AC-3": ["EV-FAILOVER"],
              "AC-4": ["EV-SINGLE-CLIENT"],
          }
          owner = {
              "version": 1,
              "task_id": task_id,
              "status": "completed",
              "summary": "MCP drawing work can now be distributed across multiple connected clients and multiple Doubao tabs without using one global task lock; README usage/limitations were updated to match.",
              "before": "The server stored one WebSocket, one global image buffer, one global task flag, and the extension stored one Doubao tab ID.",
              "after": "The server uses a round-robin client pool with per-client tab capacity and request IDs; the extension maintains a tab pool, tracks busy tabs, and returns results to the matching request.",
              "verification": [
                  {
                      "claim": claim["claim"],
                      "evidence_ids": [claim["id"]],
                  }
                  for claim in claims
              ],
              "acceptance": [
                  {
                      "criterion_id": item["id"],
                      "summary": item["text"],
                      "evidence_ids": evidence_for[item["id"]],
                  }
                  for item in contract["acceptance_criteria"]
              ],
              "consistency": {
                  "status": "aligned",
                  "summary": "README descriptive behavior was updated to match concurrent dispatch; no confirmed Product Rule or Decision was found to contradict the change, while brownfield truth readiness remains pending.",
              },
              "owner_decisions": [],
              "technical_details": [
                  "Live Doubao desktop E2E is outside GitHub Actions and remains an external-environment limitation."
              ],
          }

          for name, value in [
              ("evidence.json", evidence),
              ("convergence.json", convergence),
              ("owner-report.json", owner),
          ]:
              (bundle / name).write_text(
                  json.dumps(value, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Prove omitted Convergence coverage is blocked
        if: ${{ hashFiles('pact.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python pact.py task finish TASK-REAL-MULTI-CLIENT --json > /tmp/pact-expected-convergence-failure.json
          rc=$?
          set -e

          cat /tmp/pact-expected-convergence-failure.json
          if [ "${rc}" -eq 0 ]; then
            echo "Expected missing Convergence coverage to block completion" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import pathlib

          result = json.loads(
              pathlib.Path("/tmp/pact-expected-convergence-failure.json").read_text(
                  encoding="utf-8"
              )
          )
          errors = "\n".join(result.get("errors", []))
          if "Task Context artifact missing from Convergence coverage" not in errors:
              raise SystemExit(
                  "completion failed, but not because Context coverage was missing"
              )
          PY

          python pact.py eval --task TASK-REAL-MULTI-CLIENT --json > /tmp/pact-after-coverage-block.json
          cat /tmp/pact-after-coverage-block.json
          python - <<'PY'
          import json
          import pathlib

          observed = json.loads(
              pathlib.Path("/tmp/pact-after-coverage-block.json").read_text(
                  encoding="utf-8"
              )
          )
          if observed["completion"]["convergence_coverage_blocks"] < 1:
              raise SystemExit("expected convergence_coverage_blocks >= 1")
          if observed["completion"]["final_complete"]:
              raise SystemExit("task must remain incomplete after blocked convergence")
          PY

      - name: Add explicit Context-bound Convergence coverage
        if: ${{ hashFiles('pact.py') != '' }}
        run: |
          python - <<'PY'
          import json
          import pathlib

          task_id = "TASK-REAL-MULTI-CLIENT"
          task_dir = pathlib.Path(".pact/tasks") / task_id
          bundle = pathlib.Path(".pact/completions") / task_id

          manifest = json.loads((task_dir / "task.json").read_text(encoding="utf-8"))
          context = json.loads((task_dir / "context.json").read_text(encoding="utf-8"))
          convergence_path = bundle / "convergence.json"
          convergence = json.loads(convergence_path.read_text(encoding="utf-8"))

          coverage = []
          for item in context.get("artifacts", []):
              path = item["path"]
              if path == "README.md":
                  disposition = "aligned"
                  rationale = (
                      "README now documents multi-client / multi-tab concurrent "
                      "dispatch and no longer claims single-task-only behavior."
                  )
              else:
                  disposition = "not-applicable"
                  rationale = (
                      "Retrieved project knowledge was reviewed and is not changed "
                      "by this isolated scheduling feature."
                  )
              coverage.append(
                  {
                      "path": path,
                      "disposition": disposition,
                      "rationale": rationale,
                  }
              )

          convergence["context_sha256"] = manifest["context_sha256"]
          convergence["coverage"] = coverage
          convergence_path.write_text(
              json.dumps(convergence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Finish through PACT trust gate
        if: ${{ hashFiles('pact.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python pact.py task finish TASK-REAL-MULTI-CLIENT --json | tee /tmp/pact-finish.json
          python pact.py eval --task TASK-REAL-MULTI-CLIENT --json | tee /tmp/pact-eval.json

          python - <<'PY'
          import json
          import pathlib

          finish = json.loads(pathlib.Path("/tmp/pact-finish.json").read_text(encoding="utf-8"))
          observed = json.loads(pathlib.Path("/tmp/pact-eval.json").read_text(encoding="utf-8"))

          if not finish.get("complete"):
              raise SystemExit("final PACT completion must pass")
          if finish["convergence_coverage"]["covered_artifacts"] != finish["convergence_coverage"]["required_artifacts"]:
              raise SystemExit("all Context knowledge artifacts must be convergence-covered")
          if observed["completion"]["attempts"] != 2:
              raise SystemExit("expected one blocked attempt plus one successful attempt")
          if observed["completion"]["failed_attempts"] != 1:
              raise SystemExit("expected exactly one failed completion attempt")
          if observed["completion"]["convergence_coverage_blocks"] != 1:
              raise SystemExit("expected exactly one Convergence coverage block")
          if not observed["completion"]["final_complete"]:
              raise SystemExit("task must end completed")
          PY
